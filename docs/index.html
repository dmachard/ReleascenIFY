<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Releascenify</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Load Pyodide for WebAssembly Python -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>

<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <nav>
        <div class="logo">
            <i class="fa-solid fa-film"></i>
            <span>Releascen<strong>ify</strong></span>
        </div>
        <div class="nav-controls">
            <div class="lang-switch">
                <button id="btn-fr" class="lang-btn active">FR</button>
                <button id="btn-en" class="lang-btn">EN</button>
            </div>
            <a href="https://github.com/dmachard/releasify" target="_blank" class="github-link">
                <i class="fa-brands fa-github"></i> GitHub
            </a>
        </div>
    </nav>

    <main>
        <header>
            <h1 id="main-title">Decode any scene release.</h1>
        </header>

        <div class="mode-selector">
            <button id="mode-decode" class="mode-btn active"><i class="fa-solid fa-magic"></i> <span
                    class="mode-text-decode">Decode</span></button>
            <button id="mode-compare" class="mode-btn"><i class="fa-solid fa-code-compare"></i> <span
                    class="mode-text-compare">Compare</span></button>
        </div>

        <div class="search-container">
            <!-- Decode Mode Inputs -->
            <div id="decode-inputs" class="input-wrapper">
                <i class="fa-solid fa-magic search-icon"></i>
                <input type="text" id="release-input"
                    placeholder="e.g. Gladiator.II.2024.MULTi.2160p.WEB-DL.DV.HDR.H265-GROUP" autocomplete="off"
                    spellcheck="false">
                <button id="clear-btn" class="clear-btn"><i class="fa-solid fa-times"></i></button>
            </div>

            <!-- Compare Mode Inputs -->
            <div id="compare-inputs" class="compare-inputs-wrapper hidden">
                <div class="input-wrapper">
                    <i class="fa-solid fa-circle-a search-icon" style="color: var(--primary);"></i>
                    <input type="text" id="release-a-input" placeholder="Release A" autocomplete="off"
                        spellcheck="false">
                    <button id="clear-a-btn" class="clear-btn"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="compare-vs">VS</div>
                <div class="input-wrapper">
                    <i class="fa-solid fa-circle-b search-icon" style="color: var(--secondary);"></i>
                    <input type="text" id="release-b-input" placeholder="Release B" autocomplete="off"
                        spellcheck="false">
                    <button id="clear-b-btn" class="clear-btn"><i class="fa-solid fa-times"></i></button>
                </div>
            </div>

            <div id="loading-indicator" class="loading-indicator">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Initializing WebAssembly Python Engine...
            </div>
        </div>



        <div id="results-container" class="results-container hidden">
            <!-- Results will be injected here by JS -->
        </div>

        <div id="compare-results-container" class="compare-results-container hidden">
            <!-- Comparison results will be injected here by JS -->
        </div>

        <section class="install-section">
            <h2 id="install-title"><i class="fa-solid fa-terminal"></i> Quick Start</h2>
            <p id="install-desc" class="install-desc">Install the official library to parse your releases directly in
                Python.</p>
            <div class="install-card">
                <code class="install-code">pip install releascenify</code>
                <button class="copy-btn" onclick="copyInstallCommand()" title="Copy to clipboard"><i
                        class="fa-regular fa-copy"></i></button>
            </div>
        </section>

        <section class="docs-section">
            <h2 id="docs-title"><i class="fa-solid fa-book-open"></i> Naming Conventions</h2>
            <div id="docs-legend" class="docs-legend"></div>
            <div class="docs-grid" id="docs-grid"></div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>📦 Website built with python, WebAssembly | Made by <a href="https://github.com/dmachard"
                    target="_blank">@dmachard</a></p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
